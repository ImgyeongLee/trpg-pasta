<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9EE7E"/>
      <stop offset="1" stop-color="#86C93F"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B5A1C"/>
      <stop offset="0.5" stop-color="#3D7A27"/>
      <stop offset="1" stop-color="#244C17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2F5E14" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS 아이콘 격자: 1024 안에 824 몸체 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- 종이 -->
  <g transform="rotate(-5 492 500)" filter="url(#shadow)">
    <rect x="272" y="216" width="440" height="572" rx="40" fill="#FBFEF5"/>
    <g stroke="#D6EBBC" stroke-width="16" stroke-linecap="round">
      <line x1="338" y1="334" x2="646" y2="334"/>
      <line x1="338" y1="412" x2="646" y2="412"/>
      <line x1="338" y1="490" x2="560" y2="490"/>
    </g>
    <!-- 손글씨(이자 면발) 한 줄 -->
    <path d="M338 610 c 22 -58 58 -58 64 0 s 46 58 64 0 s 46 -58 64 0 s 40 52 62 4"
          fill="none" stroke="#2E5E1E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 펜촉 -->
  <g transform="translate(606 606) rotate(36) scale(1.25)" filter="url(#shadow)">
    <path d="M0 0 C -18 -44 -56 -104 -58 -150 L -58 -232 Q 0 -246 58 -232 L 58 -150 C 56 -104 18 -44 0 0 Z" fill="url(#nib)"/>
    <path d="M -58 -232 Q 0 -246 58 -232 L 58 -262 Q 0 -276 -58 -262 Z" fill="#1F4213"/>
    <line x1="0" y1="-8" x2="0" y2="-118" stroke="#C9EE7E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="-132" r="14" fill="#C9EE7E"/>
  </g>
</svg>
